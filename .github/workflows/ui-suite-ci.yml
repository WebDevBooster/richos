name: ui-suite-ci

# THE BROWSER SUITES, AND NOTHING HAS EVER RUN THEM BUT A PERSON TYPING THE COMMAND.
#
# There were twelve when this file was written and twenty-one on 2026-09-04, which is why
# the number is no longer in this sentence: `run.js` discovers them from disk, so the count
# is a fact about the directory and writing it here makes a second copy that goes stale.
#
# `app/ui/tests/` is the only coverage the CEO's actual screen has — the timeline renderer,
# the correction desk, the feedback channel's privacy guarantee, the affordance rule, the
# 10,000-item scale promise, and the shell that assembles them. `app-spine-ci.yml` next to
# this file covers the Rust spine and stops at the wire. `engine-self-verify.yml` covers the
# engine. Between them there was nothing at all pointed at the front end, so the suites ran
# when somebody remembered, which is the defect all three of these files exist to end.
#
# WHY macos-latest, WHICH IS TEN TIMES THE MINUTES. `lib/harness.js` rule 2: Tauri renders
# through WKWebView on macOS, and "a green Chromium run says nothing about what the CEO
# sees". That constraint survives being put on a runner. Playwright's LINUX `webkit` build is
# the WebKitGTK port — a different WebKit with a different graphics stack — so an
# ubuntu-latest job here would be cheap, green, and answering a question nobody asked. On
# macOS, Playwright ships a build of Apple's WebKit, the engine family WKWebView renders
# through. The suites take about four minutes; the bill is the price of the answer being
# about the right engine.
#
# WHY NOT FOLD IT INTO app-spine-ci.yml, which is already a job in this repository. Because
# that one is Rust on ubuntu and this one is Node on macOS: sharing a file would mean one of
# the two runs on the wrong machine, and a matrix over two jobs with nothing in common is
# ceremony. The same argument app-spine-ci.yml makes for not folding itself into the engine's
# runner applies one level in.
#
# HOW THIS CANNOT REPORT A GREEN RUN IT DID NOT EARN. Discovery-from-disk (already in
# `run.js`) fixes which suites are STARTED and says nothing about what they DID — and every
# failure of this kind in this repository exited 0 honestly: the scanner that reported CLEAN
# over an empty corpus really did run, and the `run.js` that reported "all 4 suites passed"
# really did pass the four it knew about. So `run.js` now also gates on evidence: every suite
# reports how many checks it ran, and a suite that reports none, or fewer than its own source
# declares (`run.check(` counted off disk, both sides derived, no number typed anywhere),
# fails the run whatever it exited. Zero total checks fails even if every process exited 0.
# The step below prints those counts, so the numbers are in the log rather than in a claim.
#
# WHAT IT DELIBERATELY DOES NOT COVER, named rather than skipped:
#   - NOTHING, since 2026-09-04. realbytes.js used to be named here and allowed to skip,
#     because nobody knew whether a fresh `macos-latest` image could afford the `cargo run
#     --example timeline_payload` behind it — the detached `app/src-tauri` workspace with the
#     entire webview dependency tree, estimated at a 1.3 GB build and roughly a quarter of an
#     hour. The estimate was the reason for the allowance and it was never measured.
#
#     RUN 33872963879 MEASURED IT. The image carries cargo, the suite RAN, and the gate said
#     so in as many words: `NOTE  --allow-skip=realbytes.js was passed and was not needed:
#     realbytes.js ran here.` It took 2m16s of a 25m10s job against this file's 45-minute
#     budget — 9% of the run and 5% of the ceiling — and reported 7 checks, 7 declared, 0
#     failed. Timed off the log's own stamps: the suite before it reported at 12:43:04.737Z
#     and realbytes reported at 12:45:20.937Z.
#
#     So the allowance is gone from the command line below. It cost nothing to keep and it
#     was worth more than nothing to remove: while it stood, a runner image that dropped Rust
#     would have taken this suite out silently-by-permission, and the ONE suite that renders
#     the bytes the backend actually emits is the last one to lose quietly. Any skip by any
#     suite now fails the run, which is the state the rest of this directory has always been
#     in. The 45 minutes stay — they were sized for this build and it is still in the job.
#   - §23 Phase 6, "every acceptance state in the real shell". These suites drive WebKit
#     through Playwright, not through the Tauri shell, so Phase 6 is exactly as unproven
#     after this workflow as before it. Nothing here closes it and nothing here should be
#     read as closing it.
#   - Anything about the backend's own behavior. That is `cargo test -p richos-core`, in the
#     workflow next to this one.
#
# IT HAS NOW RUN, AND THE FIRST ONE WAS RED. Run 33872963879, on the SHA `richos` went public
# with, 2026-09-04: 21 suites, 407 checks, 25m10s. `scale.js` failed 1 of 12 and `splash.js`
# failed 8 of 25 — every one of them a check that measured the RUNNER and reported it as the
# product, and every one of them green on the machine the suites were written on. The
# diagnosis and the repairs are in the commits that carry this change; the short version is
# that splash.js timed the curtain from the moment `page.goto()` returned (~55 ms after the
# curtain here, ~2,000 ms there) and scale.js asserted an absolute frame budget with nothing
# to compare it against.
#
# That run also showed `home.js` failing two checks and exiting 0, which `run.js` printed as
# FAIL and counted as fine; both the suite and the gate are fixed.
#
# It still must not be described as "CI-verified" until a run of THIS workflow is GREEN on a
# SHA somebody can name — the same sentence app-spine-ci.yml and windows-companion-ci.yml each
# carry, for the same reason.
#
# RUN FROM A CLONE ON 2026-09-04, AND IT FOUND A FLAKE BEFORE A RUNNER DID. Every step below
# was run verbatim inside a real `git clone` of `fc56c20`, in a directory holding nothing but
# that clone and under a throwaway `$HOME` — so `npm ci` fetched WebKit into an empty cache
# the way a fresh runner image does, rather than finding one already there. Result: 20 suites
# ran, 400 checks, `realbytes.js` took the skip named on the command line below, exit 0.
# `docs/verification/workflows-on-a-clone-2026-09-04/raw/ui-suite.txt`.
#
# But the first attempt was RED, on `splash.js` check 23, and the check and the splash were
# byte-identical between the two runs. Five runs on a loaded machine gave three passes and
# two failures, with the dark reading the same byte both times and the light reading not the
# same as itself — a moving sample, not a theme leak. `splash.js` had classified the strap's
# edge as an element that holds still while sampling a fixed 30%-70% band of a bar whose fill
# is inside it. It is reclassified, with the arithmetic, at the `MOVING` list in that file.
#
# THE POINT FOR WHOEVER WATCHES THE FIRST PUBLIC RUN, written before there was one and borne
# out by it: a GitHub runner is a shared VM and this suite has been shown to be load-sensitive.
# What the run added is that LOAD was not the whole story — the runner is also several times
# slower, and the failures were not flakes but assertions that had folded the harness's own
# latency into the product's clock. A timing-shaped red here is reproduced before it is
# believed and reproduced again before it is dismissed, and `splash.js` now ships the knob for
# the first half of that: `RICHOS_SPLASH_LAG_MS=2000 node splash.js` makes a fast machine
# behave like that runner.

on:
  push:
    paths:
      # Every input the suites actually read. This is the one typed list in the file and it
      # is unavoidable — a path filter is YAML, there is nowhere to derive it from. It is
      # wider than app/ui because docs-claims.js joins app/README.md and app/STREAMING.md to
      # the Rust tree they describe, and scale.js and steering.js read constants out of
      # app/src-tauri/src. A miss here costs a run that should have happened, so it errs wide.
      - "app/ui/**"
      - "app/README.md"
      - "app/STREAMING.md"
      - "app/crates/**"
      - "app/src-tauri/src/**"
      - ".github/workflows/ui-suite-ci.yml"
  pull_request:
    paths:
      - "app/ui/**"
      - "app/README.md"
      - "app/STREAMING.md"
      - "app/crates/**"
      - "app/src-tauri/src/**"
      - ".github/workflows/ui-suite-ci.yml"
  # So the gate can be demanded on a SHA without touching the tree — the first green run has
  # to be attributable to a commit somebody names.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-suites:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/ui/tests
    env:
      # THE POINT OF THE WHOLE EXERCISE, asserted rather than assumed. Empty is falsy, so
      # `loadPlaywright()` skips the override and resolves `playwright` from this directory's
      # own node_modules. If the self-contained install is ever not self-contained again,
      # this job fails instead of quietly borrowing something.
      RICHOS_PLAYWRIGHT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # macos-latest ships Node, so there is no setup action here and no third-party action
      # in the chain — the same reasoning app-spine-ci.yml gives for having no rustup step.
      # Playwright 1.61 needs >= 18; print it so a runner image bump that breaks that is
      # legible in the log rather than as a stack trace.
      - name: Toolchain
        run: |
          node --version
          npm --version

      # `npm ci`, not `npm install`: it refuses to resolve anything the committed lockfile
      # does not already name. Its postinstall (`playwright install webkit`) is what fetches
      # the engine — Playwright itself ships no postinstall, which is exactly why this
      # harness spent its first six runs pointed at another repository's node_modules.
      - name: Install
        run: npm ci

      # A bootstrap failure and a product failure must not look alike in the log. This opens
      # WebKit and prints its version before any suite runs, so "the browser never installed"
      # is a red step of its own rather than twelve confusing suite failures.
      - name: Prove WebKit is really here, before blaming any suite
        run: |
          node -e "
            const { webkit } = require('playwright');
            webkit.launch().then(async (b) => {
              console.log('WebKit ' + b.version() + ' launched from this checkout\'s own node_modules');
              await b.close();
            }).catch((e) => { console.error(e.message); process.exit(1); });
          "

      # The gate. NO suite is allowed to skip: `--allow-skip=realbytes.js` was removed on
      # 2026-09-04 after run 33872963879 measured realbytes.js running here in 2m16s. A skip,
      # no checks, or fewer checks than its source declares, by any suite, fails the run.
      - name: Every browser suite, under WebKit, with its counts
        run: npm test
