name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 0,6,9,12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this source commit already has a successful nightly
        type: boolean
        default: false

# One allocator/publisher for all triggers. Never interrupt a release mid-upload.
concurrency:
  group: richos-nightly-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'WebDevBooster/richos' && github.ref == 'refs/heads/main' && vars.NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      # Use this exact source even if main advances while the macOS job queues.
      source: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Decide whether this interval needs a build
        id: plan
        env:
          NIGHTLY_EVENT: ${{ github.event_name }}
          NIGHTLY_SCHEDULE: ${{ github.event.schedule }}
          NIGHTLY_BURST_UNTIL: ${{ vars.NIGHTLY_BURST_UNTIL }}
          NIGHTLY_FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$NIGHTLY_FORCE" = true ]; then args+=(--force); fi
          python3 richos/app/scripts/nightly.py plan \
            --event "$NIGHTLY_EVENT" --schedule "$NIGHTLY_SCHEDULE" \
            --burst-until "$NIGHTLY_BURST_UNTIL" "${args[@]}" \
            --output "$RUNNER_TEMP/nightly-plan.json"

  release:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # Bundled runtime-sources.json currently supports Apple Silicon only.
    runs-on: macos-15
    environment: nightly
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Check release credentials are configured
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVACY_LIST: ${{ secrets.RICHOS_NAMED_PERSONS }}
        run: |
          python3 - <<'PY'
          import os
          required = ('CERTIFICATE', 'CERTIFICATE_PASSWORD', 'NOTARY_KEY', 'NOTARY_ID',
                      'NOTARY_ISSUER', 'UPDATER_KEY', 'PRIVACY_LIST')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure the nightly environment secrets: ' + ', '.join(missing))
          PY
          test "$(uname -m)" = arm64
          echo "RICHOS_RUNTIME_DIR=$RUNNER_TEMP/nightly-runtime" >> "$GITHUB_ENV"
      - name: Install the pinned Tauri CLI
        run: bash richos/app/scripts/install-tauri-cli.sh
      - name: Test nightly allocation and publication failures
        run: bash richos/app/scripts/nightly.test.sh
      - name: Build and verify the bundled public runtimes
        run: |
          python3 richos/app/scripts/build-runtimes.py "$RICHOS_RUNTIME_DIR"
          python3 richos/app/scripts/verify-runtime.py "$RICHOS_RUNTIME_DIR" richos/app/scripts/runtime-sources.json
      - name: Run app and packaging gates
        run: |
          cargo test --locked --manifest-path richos/app/Cargo.toml -p richos-core
          cargo test --locked --manifest-path richos/app/crates/richos-user-update/Cargo.toml
          bash richos/app/scripts/run-tests.sh
      - name: Configure temporary signing credentials
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          PRIVACY_LIST: ${{ secrets.RICHOS_NAMED_PERSONS }}
        run: |
          python3 - <<'PY'
          import base64, os, secrets, subprocess
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          os.umask(0o077)
          (tmp / 'nightly-certificate.p12').write_bytes(base64.b64decode(os.environ['CERTIFICATE'], validate=True))
          (tmp / 'nightly-notary.p8').write_text(os.environ['NOTARY_KEY'])
          (tmp / 'nightly-named-persons').write_text(os.environ['PRIVACY_LIST'])
          keychain = str(tmp / 'nightly-signing.keychain-db')
          password = secrets.token_hex(32)
          print(f"::add-mask::{password}", flush=True)
          subprocess.run(['security', 'create-keychain', '-p', password, keychain], check=True)
          subprocess.run(['security', 'set-keychain-settings', '-lut', '10800', keychain], check=True)
          subprocess.run(['security', 'unlock-keychain', '-p', password, keychain], check=True)
          subprocess.run(['security', 'import', str(tmp / 'nightly-certificate.p12'), '-P',
                          os.environ['CERTIFICATE_PASSWORD'], '-k', keychain, '-T', '/usr/bin/codesign'], check=True)
          subprocess.run(['security', 'set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:',
                          '-s', '-k', password, keychain], check=True, stdout=subprocess.DEVNULL)
          # The runner is disposable. Its existing login keychain remains searchable.
          import shlex
          existing = shlex.split(subprocess.check_output(['security', 'list-keychains', '-d', 'user'], text=True))
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', keychain, *existing], check=True)
          PY
      - name: Allocate, build, verify and publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_EVENT: ${{ github.event_name }}
          NIGHTLY_SCHEDULE: ${{ github.event.schedule }}
          NIGHTLY_BURST_UNTIL: ${{ vars.NIGHTLY_BURST_UNTIL }}
          NIGHTLY_FORCE: ${{ inputs.force }}
          RICHOS_NAMED_PERSONS_FILE: ${{ runner.temp }}/nightly-named-persons
          RICHOS_NOTARY_KEY: ${{ runner.temp }}/nightly-notary.p8
          RICHOS_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          RICHOS_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Run the privacy gate before even publishing the generated source tag.
          bash richos/engine/scripts/named-persons.sh --tree --repo "$GITHUB_WORKSPACE"
          args=()
          if [ "$NIGHTLY_FORCE" = true ]; then args+=(--force); fi
          python3 richos/app/scripts/nightly.py plan \
            --event "$NIGHTLY_EVENT" --schedule "$NIGHTLY_SCHEDULE" \
            --burst-until "$NIGHTLY_BURST_UNTIL" "${args[@]}" \
            --output "$RUNNER_TEMP/nightly-plan.json"
          if python3 -c 'import json,sys; sys.exit(not json.load(open(sys.argv[1]))["build"])' "$RUNNER_TEMP/nightly-plan.json"; then
            python3 richos/app/scripts/nightly.py run --plan "$RUNNER_TEMP/nightly-plan.json" --out "$RUNNER_TEMP/nightly-release"
            cat "$RUNNER_TEMP/nightly-release/build-info.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/nightly-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/nightly-certificate.p12" "$RUNNER_TEMP/nightly-notary.p8" "$RUNNER_TEMP/nightly-named-persons"
