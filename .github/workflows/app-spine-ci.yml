name: app-spine-ci

# THE PRODUCT'S OWN TESTS HAVE NEVER BEEN RUN BY ANY TOOLING.
#
# `app/README.md` has documented `cargo test -p richos-core` as the spine's gate
# since the crate existed, and it is real — no network, no native dependencies, a
# couple of seconds. THE COUNT IS DELIBERATELY NOT WRITTEN HERE ANY MORE. It was
# 342 when this file was written, 375 by the end of that day, and 696 on
# 2026-09-04 after the entity registry stopped being compiled in; three numbers
# in a week, in a comment nothing checks. `app/ui/tests/docs-claims.js` holds the
# count to the tree wherever a DOCUMENT states it, so the authoritative copy
# lives in `app/README.md` and this file names the command instead of the
# arithmetic. But `grep -rn "cargo test"` across this
# repository's scripts and workflows returns README prose and nothing else. The
# two workflows that existed verified the ENGINE and the Windows companion. The
# runtime spine — ledger, entity scope, timeline visibility, ACP, and now the
# feedback channel's privacy guarantee — was covered only when somebody
# remembered to type the command.
#
# That is the defect the engine's own test runner was built to end, one repo out
# and pointed at the product instead: a correct check that nothing fires. It is
# worth saying plainly that the feedback module's "nothing goes outbound" suite
# would have been exactly that kind of check — four careful assertions about an
# absence, in a file no tool opened.
#
# WHY NOT ADD IT TO engine/scripts/ci-verify.sh, which would have been fewer
# files. Because the engine is copied wholesale by adopters who do not have this
# product in their tree, and a step that runs `cargo test -p richos-core` would
# be broken for every one of them. The engine verifies the engine. This verifies
# the thing the engine is loaded by.
#
# WHAT THIS RUN HAS NEVER DONE. This file has not executed. It was authored on
# the machine that runs the suite locally, so the assertions are green here and
# the WORKFLOW is unproven — no runner has fetched a crate for this project or
# built it on Linux. The first push is its first run and may well be red. It must
# not be described as "CI-verified" until a run of this workflow is green on a
# SHA somebody can name.
#
# WHAT HAS SINCE BEEN PROVEN, AND EXACTLY HOW FAR IT REACHES. On 2026-09-04 both
# steps below were run verbatim inside a real `git clone` of `fc56c20`, in a
# directory holding nothing but that clone — no private `richos-hq` sibling — and
# under a throwaway `$HOME`: 696 tests across 30 binaries plus the doctests,
# green, with `--locked` accepted rather than merely passed. The transcript is
# `docs/verification/workflows-on-a-clone-2026-09-04/raw/spine.txt`.
# That answers "does this tree depend on the author's machine". It does NOT
# answer "does this build on Linux", which is the runner's question and stays
# open until a real run.
#
# WHAT IT DELIBERATELY DOES NOT COVER:
#   - richos-voice. It pulls cpal and a local whisper.cpp build; a runner has no
#     audio endpoint and the native build is minutes, not seconds. Its pure logic
#     deserves the same treatment and does not get it here.
#   - app/src-tauri. A deliberately detached workspace with the whole webview
#     dependency tree behind it, kept out of the spine's test path on purpose.
#   - The live ACP round-trip, which needs a signed-in `claude` CLI.
# Named rather than skipped, so the fraction this reports is over a set somebody
# can check.

on:
  push:
    paths:
      - "app/crates/richos-core/**"
      - "app/Cargo.toml"
      # THE LOCKFILE IS AN INPUT, so a change to it has to be able to start the
      # only job that judges it. `--locked` below turns `app/Cargo.lock` into a
      # thing this job can REFUSE, and a `cargo update` touches the lock and
      # nothing else — without this line that commit passes CI by never
      # reaching it. Tracked since 2026-09-04; added here the same day, because
      # a gate you can walk around is the shape of defect this repository keeps
      # paying for.
      - "app/Cargo.lock"
      - ".github/workflows/app-spine-ci.yml"
  pull_request:
    paths:
      - "app/crates/richos-core/**"
      - "app/Cargo.toml"
      - "app/Cargo.lock"
      - ".github/workflows/app-spine-ci.yml"
  # So the gate can be demanded on a SHA without touching the tree — the first
  # green run has to be attributable to a commit somebody names.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # ubuntu-latest ships a rustup toolchain, so there is no setup action here
      # and no third-party action in the chain.
      #
      # EVERY cargo step below passes --locked, and that is the point of the step
      # rather than a flourish. `app/Cargo.lock` was gitignored until 2026-09-04,
      # so this job resolved 108 packages to whatever was current on the morning
      # it ran and a green run said nothing about the versions anybody else would
      # get. The lockfile is now tracked; --locked is what makes this job REFUSE a
      # run that would have had to resolve something dynamically, instead of
      # quietly doing it. Without the flag the file is decoration.
      #
      # A red run here reading "the lock file needs to be updated" means a
      # manifest changed without its lockfile in the same commit. The fix is
      # `cargo update -p <crate>` (or a plain build) in `app/` and committing the
      # resulting `Cargo.lock` — never dropping the flag.
      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      # The whole spine. Unit tests, the integration suites under tests/ (which
      # cargo discovers from disk rather than from a typed list), and the doctests
      # — including the compile_fail blocks that pin what the type system refuses
      # to express. A doctest run is not optional here: those blocks ARE the
      # feedback payload's negative controls, and `--lib` alone would skip them.
      - name: cargo test --locked -p richos-core
        run: cargo test --locked -p richos-core

      # Cheap, and it catches the class of change that compiles in this crate but
      # breaks a consumer's build.
      - name: cargo build --locked -p richos-core --release
        run: cargo build --locked -p richos-core --release
