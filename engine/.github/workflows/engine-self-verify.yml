name: engine-self-verify

# THE ADOPTER'S TEMPLATE. THIS COPY DOES NOT RUN, AND CANNOT.
#
# GitHub Actions discovers workflows ONLY in a `.github/workflows/` directory at
# the REPOSITORY ROOT. This copy sits under `engine/` because the engine SHIPS
# it: an adopter copies the engine's contents to their repository root (see
# README, "Adopter flow"), at which point this file lands at THEIR root and
# fires on their very next push.
#
# If you have vendored `engine/` as a SUBDIRECTORY instead of copying its
# contents to your root, copy this file to `<your repo>/.github/workflows/` and
# add:
#
#     defaults:
#       run:
#         working-directory: engine
#
# That is exactly what this engine's own repository does — see the root-level
# `.github/workflows/engine-self-verify.yml` there, which is the copy that
# actually executes. It had to be created on 2026-08-29, because for as long as
# this file was the only copy, the engine's self-verification had never run once:
# `gh run list` returned nothing at all. Not broken — unreachable. A correct rule
# with nothing enforcing it is the exact defect this engine exists to end, so it
# is worth saying plainly: A WORKFLOW THAT HAS NOT EXECUTED VERIFIES NOTHING.
#
# WHAT IT VERIFIES is deliberately NOT written down here. Both copies call
# `scripts/ci-verify.sh`, which is the single place the steps are listed —
# because two YAML files each spelling out the same seven steps is a typed
# inventory in a different costume, and this engine does not keep those. Read
# that script's header for the step list, the reasoning, and what CI can and
# cannot cover.
#
# Prerequisites: bash, git, python3 (pinned below), and standard GNU coreutils —
# the same set documented in README's "Prerequisites". No Claude API key, no
# live agents, no network beyond checkout/setup. Portability: the engine is
# developed on macOS and this runs on Linux; `docs/ci-portability-notes.md`
# records what that first Linux run actually broke, and what was fixed.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Several suites build throwaway git repositories in $TMPDIR and commit
      # into them, inheriting the machine's ambient identity by design (see the
      # comment in scripts/lib/resolve-roots.test.sh). Every workstation has
      # one; a runner has none, and without it `git commit` exits 128 inside the
      # fixtures and the probe's Layer Q quietly downgrades to "FUNCTIONAL
      # CANARY DID NOT RUN". ci-verify.sh refuses to start without an identity
      # rather than degrade, so declare it here — visibly, and only on the
      # ephemeral runner.
      - name: Declare a git identity for the throwaway test fixtures
        run: |
          git config --global user.name  "engine-self-verify"
          git config --global user.email "engine-self-verify@users.noreply.github.com"

      - name: Verify the engine (scripts/ci-verify.sh)
        run: scripts/ci-verify.sh
