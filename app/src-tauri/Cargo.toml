[package]
name = "richos-tauri"
version = "0.1.0"
edition = "2021"
description = "RichOS desktop shell (Tauri) — a thin CEO-facing surface over the richos-core runtime spine."
license = "Apache-2.0"

# DETACHED from the parent workspace: the empty [workspace] table keeps the heavy
# Tauri/webview dependency tree out of `cargo test -p richos-core`. richos-core is a
# path dependency below, so the shell always builds against the same spine.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs derives the required icon set from tauri.conf.json's own bundle.icon array
# rather than hand-typing filenames. serde_json is already in this crate's runtime
# dependencies and in tauri-build's own tree, so this adds no new download.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
richos-core = { path = "../crates/richos-core" }
# Voice mode: native audio (cpal) + local whisper.cpp + macOS `say`. Kept OUT of the
# richos-core workspace so `cargo test -p richos-core` never builds an audio stack.
richos-voice = { path = "../crates/richos-voice" }
# THE UPDATE PATH (src/updates.rs). Its minisign verification — `minisign_verify` inside
# `Update::download` — is the only thing standing between a manifest URL and code running
# on the CEO's Mac, so it is a pinned floor rather than a bare "2".
tauri-plugin-updater = "2.11.0"
# `time` for the launch check's delay only. Already in the tree beneath `tauri` (which
# builds on it), so no new download: `cargo tree -i tokio` in this crate shows it arriving
# via tauri 2.x. Named here because a file that calls `tokio::time::sleep` while depending
# on it only transitively breaks the day tauri changes runtimes.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
# `examples/verify_update_signature.rs` — the pre-publication check that a produced
# `.app.tar.gz` and its `.sig` actually agree under the key `tauri.conf.json` ships.
# DELIBERATELY THE SAME CRATE the updater verifies with (it arrives beneath
# tauri-plugin-updater), because a second Ed25519 implementation is a thing that can
# disagree with the one that matters.
minisign-verify = "0.2"
base64 = "0.22"
