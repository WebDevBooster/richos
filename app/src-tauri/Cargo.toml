[package]
name = "richos-tauri"
version = "0.1.0"
edition = "2021"
description = "RichOS desktop shell (Tauri) — a thin CEO-facing surface over the richos-core runtime spine."
license = "Apache-2.0"

# DETACHED from the parent workspace: the empty [workspace] table keeps the heavy
# Tauri/webview dependency tree out of `cargo test -p richos-core`. richos-core is a
# path dependency below, so the shell always builds against the same spine.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
richos-core = { path = "../crates/richos-core" }
