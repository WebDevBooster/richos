# RichOS app workspace.
#
# Only richos-core is a member of this workspace so the runtime-spine crate builds
# and tests fast and native-dependency-free. The Tauri shell (src-tauri/) is a
# DELIBERATELY DETACHED nested workspace (its Cargo.toml carries an empty
# [workspace] table) so the heavy webview/Tauri dependency tree never gates
# `cargo test -p richos-core`. See app/README.md for the rationale.
[workspace]
resolver = "2"
members = ["crates/richos-core"]
