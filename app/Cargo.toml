# RichOS app workspace.
#
# richos-core is the native-dependency-free runtime spine; richos-voice is the voice
# mode's audio pipeline (cpal + local whisper.cpp + macOS `say`). They are separate
# members so `cargo test -p richos-core` never builds an audio stack. The Tauri shell (src-tauri/) is a
# DELIBERATELY DETACHED nested workspace (its Cargo.toml carries an empty
# [workspace] table) so the heavy webview/Tauri dependency tree never gates
# `cargo test -p richos-core`. See app/README.md for the rationale.
[workspace]
resolver = "2"
members = ["crates/richos-core", "crates/richos-voice"]
