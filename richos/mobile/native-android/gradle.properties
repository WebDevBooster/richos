# Memory caps (build plan §5.2; Rich 2026-09-22: host memory, not CPU, is the shared bottleneck,
# so the daemon is small and exits after two idle minutes).
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.daemon.idletimeout=120000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
# Let toolchain lookup see the JDK bin/randroid runs Gradle on (the unit tests need a Java 21 runtime).
org.gradle.java.installations.fromEnv=JAVA_HOME
