# Release, extensions and platform additions to the RichOS native iPhone app (stream I3, build
# plan §5.0). Owner: stream I3.
#
# HOW IT JOINS THE PROJECT. `../project.yml` (stream I1's file) includes this file:
#
#     include:
#       - path: Release/platform.yml
#
# XcodeGen merges an included spec into the including one: dictionaries merge key by key, ARRAYS
# ARE APPENDED, and where both set the same scalar the including file (project.yml) wins
# (measured with `xcodegen dump` on 2.45.4). So this file only ADDS: two extension targets, the
# app's embedding of them, and app settings project.yml does not set. It never restates a
# project.yml key, so neither file can silently override the other.
#
# PATHS: XcodeGen reads `sources` paths in an included file relative to THAT file, so they start
# with `../`. Build-setting paths (INFOPLIST_FILE, CODE_SIGN_ENTITLEMENTS) are NOT adjusted by
# XcodeGen and Xcode reads them relative to the GENERATED project's folder, which is in the cache;
# so they start from `${RICHOS_NATIVE_IOS_ROOT}`, which XcodeGen expands from the environment.
# `bin/rios` exports it (and `Release/generate.sh` does too), so every generation defines it.
#
# Until that include line lands, `Release/generate.sh` generates the same merged project for the
# release checks and the suite (`richos/app/scripts/native-ios-share.test.sh`).

settings:
  base:
    # One place for the identity the extensions derive from. It MUST equal the app's
    # PRODUCT_BUNDLE_IDENTIFIER in project.yml (the suite checks it): an extension's identifier
    # has to start with its app's. RichConnect uses the permanent identifier approved by the CEO.
    RICHOS_BUNDLE_ID: dev.richos.connect
    # What the Home Screen shows. The device tools' test copy builds with "RichConnect Perf" beside the CEO's app.
    RICHOS_APP_DISPLAY_NAME: RichConnect
    RICHOS_APP_GROUP: group.$(RICHOS_BUNDLE_ID)
    RICHOS_KEYCHAIN_GROUP: $(RICHOS_BUNDLE_ID).shared
    # The entitlements files by name, so the device tools' test copy (dev.richos.connect.perf) can name
    # the two without an App Group: Xcode's automatic signing does not register group.<test id> for the
    # team from the command line, so a profile with the group is never made (2026-10-03 build failure).
    RICHOS_APP_ENTITLEMENTS: RichOSNative.entitlements
    RICHOS_SHARE_ENTITLEMENTS: ShareExtension.entitlements

targets:
  RichOSNative:
    dependencies:
      # Embedded in the app's PlugIns folder.
      - target: RichOSNotificationService
      - target: RichOSShare
    settings:
      base:
        # Custom keys the generated Info.plist cannot express (the App Group and Keychain group
        # names the extensions share); merged with the generated keys.
        INFOPLIST_FILE: ${RICHOS_NATIVE_IOS_ROOT}/Release/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: ${RICHOS_NATIVE_IOS_ROOT}/Release/$(RICHOS_APP_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Purpose strings, American English (ceo-decisions §13). Each says what is used, when,
        # and where it goes, and nothing more (App Review 5.1.1(ii)). Drafts from
        # richos-hq docs/research/2026-09-22-app-store-approval-t3-and-first-time.md §4.3.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "RichConnect records only while you hold or lock the microphone button, then sends the voice message to your Mac so Rich can reply."
        INFOPLIST_KEY_NSCameraUsageDescription: "RichConnect uses the camera to scan the pairing code on your Mac, and to take a photo when you choose to send one to Rich. Photos go only to your Mac."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "RichConnect sends Rich only the photos you pick. It does not read the rest of your library."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "RichConnect uses your network only to reach your own Mac. It does not look for other devices."
        # Export compliance: the app's only cryptography is Apple's own — HTTPS through URLSession,
        # and CryptoKit/Security for P-256 request signing and AES-GCM decryption of reply
        # previews. That is encryption within the Apple operating system, which Apple's
        # "Complying with encryption export regulations" names as exempt; set here so App Store
        # Connect does not ask on every upload. The account holder confirms the answer in App
        # Store Connect (approval research §2, "Export compliance").
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # The source checkout, for the archive's source stamp below (expanded at generation).
        RICHOS_SOURCE_ROOT: ${RICHOS_NATIVE_IOS_ROOT}
        # The stamp reads the checkout's Git state, which a sandboxed script cannot; it is this
        # target's only script.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
      configs:
        Debug:
          RICHOS_APS_ENVIRONMENT: development
        Release:
          RICHOS_APS_ENVIRONMENT: production
    postBuildScripts:
      # The freshness contract: an archive carries the commit it was built from. RichOSSourceCommit and
      # RichOSSourceDirty go into the archived app's Info.plist (before it is signed), and
      # `testflight.ts upload` gates that commit (CEO §106), refusing an archive without them or with
      # uncommitted app code. Archives only (ACTION=install); every other build skips it.
      - name: Stamp the source commit (archive only)
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          [ "$ACTION" = install ] || exit 0
          exec python3 -B "$RICHOS_SOURCE_ROOT/../perf/shipgate.py" stamp --platform ios \
            --checkout "$RICHOS_SOURCE_ROOT" --plist "$TARGET_BUILD_DIR/$INFOPLIST_PATH"

  # Decrypts the reply preview on the phone before the alert shows (PRD §5; the preserved app's
  # design, richos/mobile/ios/NotificationExtension/, ported, never modified).
  RichOSNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: ../NotificationService/Sources
      - path: ../App/Platform/Shared
    dependencies:
      # The shared platform code speaks the core's types (base64url, wire shapes); Foundation only.
      - package: RichOSCore
        product: RichOSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RICHOS_BUNDLE_ID).notification-service
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: RichOSNotificationService
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: ${RICHOS_NATIVE_IOS_ROOT}/NotificationService/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: RichConnect
        CODE_SIGN_ENTITLEMENTS: ${RICHOS_NATIVE_IOS_ROOT}/NotificationService/NotificationService.entitlements
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"

  # "Share to Rich" from any app (ceo-decisions §75; round-12 attachments `share-*`).
  RichOSShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ../ShareExtension/Sources
      - path: ../App/Platform/Shared
      # The screens stream's design system (palette, type, motion, mark), shared rather than
      # copied so the sheet cannot drift from the app. Self-contained: SwiftUI and RichOSCore only.
      - path: ../App/Design
    dependencies:
      - package: RichOSCore
        product: RichOSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RICHOS_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: RichOSShare
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: ${RICHOS_NATIVE_IOS_ROOT}/ShareExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: RichConnect
        CODE_SIGN_ENTITLEMENTS: ${RICHOS_NATIVE_IOS_ROOT}/ShareExtension/$(RICHOS_SHARE_ENTITLEMENTS)
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"

  # Stream I3's tests on a simulator: the share sheet's model and rendering, the platform effect
  # handler, the notification platform. The extension's and the platform's own sources are compiled
  # in (they are not importable from the app module); the app hosts the bundle so UIApplication,
  # the Keychain and the bundled fonts exist. Run by richos/app/scripts/native-ios-share.test.sh.
  RichOSPlatformTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../PlatformTests
      - path: ../ShareExtension/Sources
      - path: ../App/Platform
      - path: ../App/Design
    dependencies:
      - target: RichOSNative
      - package: RichOSCore
        product: RichOSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RICHOS_BUNDLE_ID).platform-tests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RichOSNative.app/RichOSNative"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  RichOSPlatformTests:
    build:
      targets:
        RichOSPlatformTests: [test]
    test:
      config: Debug
      targets:
        - RichOSPlatformTests
      gatherCoverageData: false
