# XcodeGen spec for the RichOS native iPhone app.
#
# The Xcode project is GENERATED into the external cache by `bin/rios sim …` and never committed:
# this file is the only project definition in the repository, so two engineers and an agent can
# change it without a .pbxproj merge. Sources are Xcode 16 folder-synchronized groups
# (`syncedFolder`), so a new Swift file under App/ or UITests/ is picked up without editing this
# file or regenerating the project.
#
# Owner: stream I1 (build plan §5.0). Screens (App/Features, App/Design) and UI tests (UITests)
# belong to I2 and need no change here to be added.
name: RichOSNative
options:
  deploymentTarget:
    iOS: "17.0"
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
packages:
  RichOSCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Complete concurrency checking, reported as warnings in Swift 5 mode (build plan §3.2).
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "YES"
    # Ad hoc signing is enough for the simulator; device and TestFlight signing come with the
    # CEO's Apple team (stream I3).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  RichOSNative:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: DevBridge
    dependencies:
      - package: RichOSCore
        product: RichOSCore
      # Fixtures and the command envelope are `#if DEBUG` inside the package, so a Release build
      # links an empty module. `bin/rios sim check-release` proves it.
      - package: RichOSCore
        product: RichOSFixtures
    settings:
      base:
        # A DEVELOPMENT identifier (Rich's decision, 2026-09-22). Never `dev.richos.mobile.loop`,
        # which would replace the preserved app on a phone. The production identifier is the CEO's.
        PRODUCT_BUNDLE_IDENTIFIER: dev.richos.native.ios
        PRODUCT_NAME: RichOSNative
        INFOPLIST_KEY_CFBundleDisplayName: RichOS
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          # The development mailbox is also `#if DEBUG`; excluding its files is the second lock.
          EXCLUDED_SOURCE_FILE_NAMES: "DevBridge*.swift"
  RichOSNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        optional: true
    dependencies:
      - target: RichOSNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.richos.native.ios.uitests
        TEST_TARGET_NAME: RichOSNative
schemes:
  RichOSNative:
    build:
      targets:
        RichOSNative: all
    test:
      config: Debug
      targets:
        - RichOSNativeUITests
      gatherCoverageData: false
