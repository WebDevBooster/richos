# XcodeGen spec for the RichOS native iPhone app.
#
# The Xcode project is GENERATED into the external cache by `bin/rios sim …` and never committed:
# this file is the only project definition in the repository, so two engineers and an agent can
# change it without a .pbxproj merge. Sources are Xcode 16 folder-synchronized groups
# (`syncedFolder`), so a new Swift file under App/ or UITests/ is picked up without editing this
# file or regenerating the project.
#
# Owner: stream I1 (build plan §5.0). Screens (App/Features, App/Design) and UI tests (UITests)
# belong to I2 and need no change here to be added; so does UnitTests.
name: RichOSNative
# Stream I3's release, extension and platform additions (they only ADD; see that file's header).
include:
  - path: Release/platform.yml
options:
  deploymentTarget:
    iOS: "17.0"
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
packages:
  RichOSCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Complete concurrency checking, reported as warnings in Swift 5 mode (build plan §3.2).
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "YES"
    # Ad hoc signing is enough for the simulator; device and TestFlight signing come with the
    # CEO's Apple team (stream I3).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # Set per run by native-ios-ui.test.sh; TestSupport/BuildStamp.swift says why.
    RICHOS_BUILD_STAMP: unstamped
targets:
  RichOSNative:
    type: application
    platform: iOS
    sources:
      # Notes and plans kept beside the screens are not app resources.
      - path: App
        excludes:
          - "**/*.md"
      - path: DevBridge
    dependencies:
      - package: RichOSCore
        product: RichOSCore
      # Fixtures and the command envelope are `#if DEBUG` inside the package, so a Release build
      # links an empty module. `bin/rios sim check-release` proves it.
      - package: RichOSCore
        product: RichOSFixtures
    settings:
      base:
        # Permanent identifier approved by the CEO. The preserved app keeps its own identifier.
        PRODUCT_BUNDLE_IDENTIFIER: dev.richos.connect
        PRODUCT_NAME: RichOSNative
        INFOPLIST_KEY_CFBundleDisplayName: RichConnect
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          # The development mailbox is also `#if DEBUG`; excluding its files is the second lock.
          EXCLUDED_SOURCE_FILE_NAMES: "DevBridge*.swift"
  # Unit tests that need the app's UIKit views in a window (the adopted T3 transcript tests,
  # adoption ledger §2.8 M2, "with their tests"). UnitTests/ belongs to stream I2.
  RichOSNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
        optional: true
      - path: TestSupport/BuildStamp.swift
    dependencies:
      - target: RichOSNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.richos.connect.tests
        INFOPLIST_FILE: ${RICHOS_NATIVE_IOS_ROOT}/TestSupport/TestBundle-Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RichOSNative.app/RichOSNative"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RichOSNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        optional: true
      - path: TestSupport/BuildStamp.swift
    dependencies:
      - target: RichOSNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.richos.connect.uitests
        INFOPLIST_FILE: ${RICHOS_NATIVE_IOS_ROOT}/TestSupport/TestBundle-Info.plist
        TEST_TARGET_NAME: RichOSNative
schemes:
  RichOSPhysical:
    build:
      targets:
        RichOSNative: all
    test:
      config: Release
      targets:
        - name: RichOSNativeUITests
          selectedTests:
            - PhysicalDeviceTests
      gatherCoverageData: false
  RichOSNative:
    build:
      targets:
        RichOSNative: all
    test:
      config: Debug
      targets:
        - RichOSNativeTests
        - RichOSNativeUITests
      gatherCoverageData: false
