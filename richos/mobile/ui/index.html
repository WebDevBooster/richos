<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'">
  <title>RichOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><h1>RichOS</h1><p id="connection" role="status">Opening…</p></header>
    <label for="thread">Conversation</label>
    <select id="thread" aria-label="Conversation"></select>
    <section aria-label="Outbox"><h2>Messages waiting to send</h2><p id="empty">No queued messages</p><ul id="outbox"></ul></section>
    <form id="composer">
      <label for="message">Message</label>
      <textarea id="message" aria-label="Message" placeholder="Talk to Rich" rows="3"></textarea>
      <div class="actions"><button id="send" type="submit">Send</button><button id="retry" type="button">Retry</button></div>
    </form>
    <p id="error" role="alert"></p>
  </main>
  <script src="queue.js"></script>
  <script src="app.js"></script>
  <script src="view.js"></script>
  <!-- ENTRY -->
</body>
</html>
