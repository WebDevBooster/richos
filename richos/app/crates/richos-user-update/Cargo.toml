[package]
name = "richos-user-update"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
flate2 = "1"
libc = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tar = "0.4"

[dev-dependencies]
tempfile = "3"

# Check ignored outcomes and asynchronous work at the lint entry point.
# Timeout refusal regression: a0b51998. These warn on related Rust mistakes;
# shell timeout control flow is covered by the project rule, not by Clippy.
[lints.rust]
unused_must_use = "warn"

[lints.clippy]
let_underscore_future = "warn"
let_underscore_must_use = "warn"
await_holding_lock = "warn"
