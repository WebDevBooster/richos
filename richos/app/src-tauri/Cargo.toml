[package]
name = "richos-tauri"
version = "1.2.0-nightly.20260918.3"
edition = "2021"
description = "RichOS desktop shell (Tauri) — a thin CEO-facing surface over the richos-core runtime spine."
license = "AGPL-3.0-only"

# DETACHED from the parent workspace: the empty [workspace] table keeps the heavy
# Tauri/webview dependency tree out of `cargo test -p richos-core`. richos-core is a
# path dependency below, so the shell always builds against the same spine.
[workspace]

# THE PRODUCTION CONTEXT, ON BY DEFAULT — THIS IS NOT COSMETIC.
#
# `tauri::generate_context!()` expands into one of two different programs, and which one
# it expands into is decided by a single feature on the `tauri` crate:
# `tauri-macros-2.6.3/src/context.rs:155` sets `dev: cfg!(not(feature = "custom-protocol"))`.
#
# With `dev` true, `tauri-codegen-2.6.3/src/context.rs:439-445` emits
#
#     context.with_config_parent("<CARGO_MANIFEST_DIR>");
#
# as a STRING LITERAL in generated code. `--remap-path-prefix`, which package-app.sh
# exports and which removes the other 656 occurrences of the builder's home directory,
# cannot touch it: that flag rewrites the compiler's own path metadata, not program data a
# macro already produced. MEASURED at 9a7799e — a release build with the full remap in
# force still carried exactly one host path, and it was this one.
#
# The literal is the visible half. The larger half is that a `dev` binary is not the
# shipping configuration at all: `tauri-2.11.5/src/app.rs:348-360` falls back to READING
# FRONTEND FILES OFF DISK from that same path when an embedded asset is missing, and
# `manager/mod.rs:369-380` serves `devCsp` instead of `csp`. On a stranger's machine that
# path does not exist.
#
# `cargo tauri build` was never affected, because the CLI pushes the feature itself
# (`tauri-cli-2.11.4/src/interface/rust.rs:485`). A plain `cargo build --release` was —
# and this repository tells people to run exactly that
# (`app/scripts/frontend-payload.test.sh:159`). Declaring it as a DEFAULT feature makes
# every invocation produce the same program, which is the whole point of environment
# parity: two build paths that disagree is a defect waiting for the one day it matters.
#
# `cargo tauri dev` is unaffected and still gets a dev build: the CLI's dev path filters
# default features that enable `tauri/custom-protocol` and passes `--no-default-features`
# (`rust.rs:435-451`). A deliberate dev build by hand is `--no-default-features`.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs derives the required icon set from tauri.conf.json's own bundle.icon array
# rather than hand-typing filenames. serde_json is already in this crate's runtime
# dependencies and in tauri-build's own tree, so this adds no new download.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
richos-core = { path = "../crates/richos-core" }
# Owner-only publication; never invokes the updater plugin's privileged macOS installer.
richos-user-update = { path = "../crates/richos-user-update" }
# Voice mode: native audio (cpal) + local whisper.cpp + macOS `say`. Kept OUT of the
# richos-core workspace so `cargo test -p richos-core` never builds an audio stack.
richos-voice = { path = "../crates/richos-voice" }
# THE UPDATE PATH (src/updates.rs). Its minisign verification — `minisign_verify` inside
# `Update::download` — is the only thing standing between a manifest URL and code running
# on the CEO's Mac, so it is a pinned floor rather than a bare "2".
tauri-plugin-updater = "2.11.0"
# `time` for the launch check's delay only. Already in the tree beneath `tauri` (which
# builds on it), so no new download: `cargo tree -i tokio` in this crate shows it arriving
# via tauri 2.x. Named here because a file that calls `tokio::time::sleep` while depending
# on it only transitively breaks the day tauri changes runtimes.
# `rt` joins `time` for `examples/provision_model.rs`, which drives the shipped async fetch loop
# on a current-thread runtime so a real download can be proven without launching the app.
# `tauri` already builds on tokio's runtime, so features unify and the Cargo.lock diff for this
# line is empty.
tokio = { version = "1", features = ["time", "rt"] }
# THE SPEECH-MODEL DOWNLOAD (src/voice_provision.rs).
#
# NO NEW CRATE, AND THE FEATURE LIST IS WHY IT IS SPELLED OUT RATHER THAN LEFT TO A DEFAULT.
# `tauri-plugin-updater` already depends on `reqwest 0.13` with `default-features = false` and
# exactly `["json", "stream"]`, and its own default feature set adds `reqwest/rustls-no-provider`
# and `reqwest/system-proxy`. Cargo unifies features across the graph, so every feature named
# below is ALREADY enabled in this binary today. Naming a feature the plugin does not enable
# (`http2`, `rustls`) would pull `h2` or `aws-lc-rs` — and `aws-lc-rs` needs a C toolchain the
# build does not have — which is exactly the kind of inherited default the CEO's standing rule
# refuses. The proof is the Cargo.lock diff for this commit: it adds no [[package]] entry.
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
# `StreamExt::next` over the response byte stream, and nothing else. Already in the lock.
futures-util = { version = "0.3", default-features = false }
# THE TLS CRYPTO PROVIDER, INSTALLED BY US RATHER THAN HOPED FOR.
#
# `reqwest/rustls-no-provider` means reqwest picks no cipher implementation: a process-level
# provider must be installed before a client is built, or the build fails. Today the only code
# in this binary that installs one is `tauri-plugin-updater-2.11.0/src/updater.rs:492-494`, and
# it does so lazily, inside the update check. So a model download that happens before the app has
# ever checked for an update would find no provider at all — a dependency on the ORDER two
# unrelated features run in, which is a defect waiting for the one first run that hits it.
# `voice_provision.rs` therefore installs the same `ring` provider itself, idempotently, before
# building its client. Already in the lock at 0.23.43 beneath the updater plugin.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# THE REAL DOWNLOAD, WITHOUT A WINDOW. Compiles src/voice_provision.rs by path, exactly as
# examples/window_placement.rs compiles src/window_geometry.rs, and substitutes only the observer.
# Declared here rather than left to auto-discovery so every example this crate ships is visible in
# one list.
[[example]]
name = "provision_model"
path = "examples/provision_model.rs"

[dev-dependencies]
# `examples/verify_update_signature.rs` — the pre-publication check that a produced
# `.app.tar.gz` and its `.sig` actually agree under the key `tauri.conf.json` ships.
# DELIBERATELY THE SAME CRATE the updater verifies with (it arrives beneath
# tauri-plugin-updater), because a second Ed25519 implementation is a thing that can
# disagree with the one that matters.
minisign-verify = "0.2"
base64 = "0.22"
# `examples/verify_update_manifest.rs` — the same reasoning one level up. It compares an
# offered version against an installed one with the ORDERING the updater uses
# (`updater.rs:575`, `release.version > self.current_version`), and `RemoteRelease.version`
# is already a `semver::Version`. Comparing those two as strings is the defect this avoids:
# "0.1.10" sorts below "0.1.9" and the release nobody is offered looks perfect.
semver = "1"
