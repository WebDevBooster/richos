<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RichOS Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span id="dot" class="dot idle"></span>
      <h1>RichOS Helper</h1>
      <a id="options-link" href="#">Settings</a>
    </header>

    <h2>Call capture</h2>
    <section id="status" class="card">
      <p class="muted">Loading…</p>
    </section>

    <section id="problems"></section>

    <section id="actions">
      <button id="arm" class="primary" hidden>Arm capture on this tab</button>
      <button id="stop" class="danger" hidden>Finish recording</button>
    </section>

    <section id="exports"></section>

    <section id="recent"></section>

    <section id="gpt-section" hidden>
      <h2>ChatGPT export</h2>
      <p id="gpt-summary" class="muted"></p>
      <iframe id="gpt-panel" title="ChatGPT export" hidden></iframe>
      <button id="gpt-open">Open ChatGPT export controls</button>
    </section>

    <footer>
      <span class="muted" id="hint"></span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
